name: Contract CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  compile-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compile BaseProofRegistryV2
        run: npm run compile:v2
